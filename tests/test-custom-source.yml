name: Test custom source path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PowerShell
        run: |
          if ! command -v pwsh &>/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y -q powershell
          fi
          pwsh --version

      - name: Set up custom rules directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/my-rules"
          cp "$GITHUB_WORKSPACE/tests/fixtures/ps-rule/passing.Rule.ps1" "$GITHUB_WORKSPACE/my-rules/"
          cp "$GITHUB_WORKSPACE/tests/fixtures/ps-rule/sample.yaml" "$GITHUB_WORKSPACE/"

      - id: action
        name: Run PSRule with custom source path
        uses: .
        with:
          inputType: 'repository'
          source: 'my-rules/'
          summary: 'false'

      - name: Assert action succeeded
        run: |
          echo "PSRule action with custom source completed successfully"
          echo "PASS"
