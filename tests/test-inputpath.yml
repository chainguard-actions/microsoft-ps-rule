name: Test inputPath input type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PowerShell
        run: |
          if ! command -v pwsh &>/dev/null; then
            echo "Installing PowerShell..."
            apt-get update -qq
            apt-get install -y wget apt-transport-https software-properties-common
            wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
            dpkg -i packages-microsoft-prod.deb
            apt-get update -qq
            apt-get install -y powershell
          else
            echo "PowerShell already installed: $(pwsh --version)"
          fi

      - name: Run PSRule with inputPath input type
        id: psrule
        uses: .
        with:
          inputType: inputPath
          source: tests/fixtures/ps-rule/
          inputPath: tests/fixtures/input/
          summary: 'false'

      - name: Assert action completed successfully
        run: |
          echo "PSRule inputPath mode completed successfully"
          echo "PASS"
