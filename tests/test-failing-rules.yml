name: Test failing rules - action should fail
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PowerShell
        run: |
          if ! command -v pwsh &>/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y -q powershell
          fi
          pwsh --version

      - name: Set up PSRule with failing rules
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.ps-rule"
          cp "$GITHUB_WORKSPACE/tests/fixtures/ps-rule-fail/failing.Rule.ps1" "$GITHUB_WORKSPACE/.ps-rule/"
          cp "$GITHUB_WORKSPACE/tests/fixtures/ps-rule/sample.yaml" "$GITHUB_WORKSPACE/"

      - id: action
        name: Run PSRule with failing rules (expected to fail)
        uses: .
        with:
          inputType: 'repository'
          source: '.ps-rule/'
          summary: 'false'
        continue-on-error: true

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: Expected action to fail when rules fail, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: Action correctly failed when rules failed"
