name: Test NUnit3 output format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PowerShell
        run: |
          if ! command -v pwsh &>/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y -q powershell
          fi
          pwsh --version

      - name: Set up PSRule source and input
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.ps-rule"
          cp "$GITHUB_WORKSPACE/tests/fixtures/ps-rule/passing.Rule.ps1" "$GITHUB_WORKSPACE/.ps-rule/"
          cp "$GITHUB_WORKSPACE/tests/fixtures/ps-rule/sample.yaml" "$GITHUB_WORKSPACE/"
          mkdir -p "$GITHUB_WORKSPACE/reports"

      - id: action
        name: Run PSRule with NUnit3 output
        uses: .
        with:
          inputType: 'repository'
          source: '.ps-rule/'
          outputFormat: 'NUnit3'
          outputPath: 'reports/results.xml'
          summary: 'false'

      - name: Assert NUnit3 output file was created
        run: |
          OUTPUT_FILE="$GITHUB_WORKSPACE/reports/results.xml"
          echo "Checking for output file: $OUTPUT_FILE"
          if [ ! -f "$OUTPUT_FILE" ]; then
            echo "FAIL: Expected NUnit3 output file not found at $OUTPUT_FILE"
            exit 1
          fi
          echo "Output file exists"
          if ! grep -q "<?xml" "$OUTPUT_FILE" && ! grep -q "<test-results" "$OUTPUT_FILE" && ! grep -q "<test-run" "$OUTPUT_FILE"; then
            echo "FAIL: Output file does not appear to contain NUnit3 XML"
            cat "$OUTPUT_FILE"
            exit 1
          fi
          echo "PASS: NUnit3 output file created successfully"
