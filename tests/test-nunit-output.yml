name: Test PSRule NUnit3 output format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PowerShell
        run: |
          if ! command -v pwsh &>/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y wget apt-transport-https software-properties-common
            wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
            dpkg -i packages-microsoft-prod.deb
            apt-get update -qq
            apt-get install -y powershell
          fi
          pwsh --version

      - name: Create output directory
        run: mkdir -p "$GITHUB_WORKSPACE/reports"

      - name: Run PSRule action with NUnit3 output
        id: psrule
        uses: .
        with:
          inputType: repository
          source: tests/fixtures/.ps-rule-basic/
          inputPath: tests/fixtures/src/
          outputFormat: NUnit3
          outputPath: reports/psrule-results.xml
          version: '2.6.0'

      - name: Assert NUnit3 output file was created
        run: |
          OUTPUT_FILE="$GITHUB_WORKSPACE/reports/psrule-results.xml"
          echo "Checking for NUnit3 output file: $OUTPUT_FILE"
          if [ ! -f "$OUTPUT_FILE" ]; then
            echo "FAIL: Expected NUnit3 output file not found at $OUTPUT_FILE"
            exit 1
          fi
          echo "NUnit3 output file exists"
          CONTENT=$(cat "$OUTPUT_FILE")
          echo "Content preview: ${CONTENT:0:200}"
          # Verify it contains XML content
          if ! echo "$CONTENT" | grep -q "<?xml\|<test-results\|<test-run"; then
            echo "FAIL: Output file does not appear to contain NUnit3 XML"
            exit 1
          fi
          echo "PASS: NUnit3 output file created with XML content"
