name: Test basic repository analysis
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install PowerShell
        run: |
          if command -v pwsh >/dev/null 2>&1; then
            echo "PowerShell already installed: $(pwsh --version)"
            exit 0
          fi
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y wget apt-transport-https software-properties-common ca-certificates
          if [ -f /etc/os-release ]; then
            . /etc/os-release
            UBUNTU_VERSION="${VERSION_ID}"
          else
            UBUNTU_VERSION="22.04"
          fi
          echo "Detected Ubuntu version: ${UBUNTU_VERSION}"
          wget -q "https://packages.microsoft.com/config/ubuntu/${UBUNTU_VERSION}/packages-microsoft-prod.deb" -O /tmp/packages-microsoft-prod.deb
          dpkg -i /tmp/packages-microsoft-prod.deb
          apt-get update -qq
          apt-get install -y powershell
          pwsh --version
      - name: Pre-install PSRule module
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Install-Module -Repository PSGallery -Name PSRule -RequiredVersion '2.6.0' -Scope CurrentUser -Force -ErrorAction Stop
          Write-Host "PSRule ready"
      - name: Run PSRule with repository input type
        id: action
        uses: .
        with:
          inputType: repository
          source: tests/fixtures/ps-rule/
          inputPath: tests/fixtures/input/
      - name: Assert action completed successfully
        run: |
          echo "PSRule analysis completed successfully"
          echo "PASS"
