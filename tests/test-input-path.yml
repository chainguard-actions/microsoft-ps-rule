name: Test PSRule with inputPath input type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PowerShell
        run: |
          if command -v pwsh &>/dev/null; then
            echo "PowerShell already installed: $(pwsh --version)"
            exit 0
          fi
          wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb" \
            -O /tmp/packages-microsoft-prod.deb || \
          wget -q "https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb" \
            -O /tmp/packages-microsoft-prod.deb
          sudo dpkg -i /tmp/packages-microsoft-prod.deb
          sudo apt-get update -q
          sudo apt-get install -y powershell
          pwsh --version

      - id: action
        uses: .
        with:
          inputType: inputPath
          inputPath: tests/fixtures/input/
          source: tests/fixtures/ps-rule-input/
          summary: 'false'
        continue-on-error: true

      - name: Assert action ran successfully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed but got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
