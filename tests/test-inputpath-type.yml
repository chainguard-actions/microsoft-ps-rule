name: Test inputPath input type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PowerShell
        run: |
          if ! command -v pwsh &>/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y -q powershell
          fi
          pwsh --version

      - name: Set up PSRule source and input files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.ps-rule"
          cp "$GITHUB_WORKSPACE/tests/fixtures/ps-rule/passing.Rule.ps1" "$GITHUB_WORKSPACE/.ps-rule/"
          mkdir -p "$GITHUB_WORKSPACE/input-files"
          cp "$GITHUB_WORKSPACE/tests/fixtures/ps-rule/sample.yaml" "$GITHUB_WORKSPACE/input-files/"

      - id: action
        name: Run PSRule with inputPath type
        uses: .
        with:
          inputType: 'inputPath'
          inputPath: 'input-files/'
          source: '.ps-rule/'
          summary: 'false'

      - name: Assert action succeeded
        run: |
          echo "PSRule action with inputPath type completed successfully"
          echo "PASS"
