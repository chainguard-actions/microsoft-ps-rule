name: Test output format - write results to JSON file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PowerShell Core
        run: |
          if command -v pwsh &>/dev/null; then
            echo "pwsh already available: $(pwsh --version)"
          else
            echo "Installing PowerShell Core..."
            UBUNTU_VERSION=$(lsb_release -rs 2>/dev/null || echo "22.04")
            wget -q "https://packages.microsoft.com/config/ubuntu/${UBUNTU_VERSION}/packages-microsoft-prod.deb" -O /tmp/packages-microsoft-prod.deb 2>/dev/null || \
              wget -q "https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb" -O /tmp/packages-microsoft-prod.deb
            sudo dpkg -i /tmp/packages-microsoft-prod.deb
            sudo apt-get update -q
            sudo apt-get install -y powershell
            pwsh --version
          fi

      - name: Create output directory
        run: mkdir -p "$GITHUB_WORKSPACE/reports"

      - name: Run PSRule with JSON output format
        id: psrule
        uses: .
        with:
          inputType: inputPath
          inputPath: tests/fixtures/input/
          source: tests/fixtures/ps-rule/
          outputFormat: Json
          outputPath: reports/results.json
          summary: 'false'

      - name: Assert output file was created
        run: |
          OUTPUT_FILE="$GITHUB_WORKSPACE/reports/results.json"
          echo "Checking for output file: $OUTPUT_FILE"
          if [ ! -f "$OUTPUT_FILE" ]; then
            echo "FAIL: Expected output file not found at $OUTPUT_FILE"
            exit 1
          fi
          echo "Output file exists"
          echo "Content preview:"
          head -20 "$OUTPUT_FILE" || true
          echo "PASS"
