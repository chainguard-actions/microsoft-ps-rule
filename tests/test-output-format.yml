name: Test output format (JSON)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PowerShell
        run: |
          if ! command -v pwsh &>/dev/null; then
            echo "Installing PowerShell..."
            apt-get update -qq
            apt-get install -y wget apt-transport-https software-properties-common
            wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
            dpkg -i packages-microsoft-prod.deb
            apt-get update -qq
            apt-get install -y powershell
          else
            echo "PowerShell already installed: $(pwsh --version)"
          fi

      - name: Run PSRule with JSON output format
        id: psrule
        uses: .
        with:
          inputType: repository
          source: tests/fixtures/ps-rule/
          inputPath: tests/fixtures/input/
          outputFormat: Json
          outputPath: /tmp/psrule-results.json
          summary: 'false'

      - name: Assert output file was created
        run: |
          echo "Checking for output file at /tmp/psrule-results.json"
          if [ ! -f "/tmp/psrule-results.json" ]; then
            echo "FAIL: output file /tmp/psrule-results.json was not created"
            exit 1
          fi
          echo "Output file exists"
          cat /tmp/psrule-results.json
          echo "PASS"
