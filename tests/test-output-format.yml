name: Test PSRule output format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PowerShell
        run: |
          if ! command -v pwsh &>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y wget apt-transport-https software-properties-common
            wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
            sudo dpkg -i packages-microsoft-prod.deb
            sudo apt-get update -qq
            sudo apt-get install -y powershell
          fi
          pwsh --version

      - name: Run PSRule action (JSON output format)
        id: psrule
        uses: .
        with:
          inputType: inputPath
          inputPath: tests/fixtures/input-files/
          source: tests/fixtures/.ps-rule/
          outputFormat: Json
          outputPath: reports/psrule-results.json
          summary: 'false'

      - name: Assert output file was created
        run: |
          OUTPUT_FILE="$GITHUB_WORKSPACE/reports/psrule-results.json"
          echo "Checking for output file: $OUTPUT_FILE"
          if [ ! -f "$OUTPUT_FILE" ]; then
            echo "FAIL: Output file was not created at $OUTPUT_FILE"
            exit 1
          fi
          echo "Output file exists"
          # Verify it's valid JSON
          if ! python3 -c "import json, sys; json.load(open('$OUTPUT_FILE'))" 2>/dev/null; then
            echo "FAIL: Output file is not valid JSON"
            cat "$OUTPUT_FILE"
            exit 1
          fi
          echo "PASS: Output file is valid JSON"
