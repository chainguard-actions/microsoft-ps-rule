name: Test summary output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PowerShell Core
        run: |
          if command -v pwsh &>/dev/null; then
            echo "pwsh already available: $(pwsh --version)"
          else
            echo "Installing PowerShell Core..."
            UBUNTU_VERSION=$(lsb_release -rs 2>/dev/null || echo "22.04")
            wget -q "https://packages.microsoft.com/config/ubuntu/${UBUNTU_VERSION}/packages-microsoft-prod.deb" -O /tmp/packages-microsoft-prod.deb 2>/dev/null || \
              wget -q "https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb" -O /tmp/packages-microsoft-prod.deb
            sudo dpkg -i /tmp/packages-microsoft-prod.deb
            sudo apt-get update -q
            sudo apt-get install -y powershell
            pwsh --version
          fi

      - name: Set up reports directory and GITHUB_STEP_SUMMARY
        run: |
          mkdir -p "$GITHUB_WORKSPACE/reports"
          if [ -z "$GITHUB_STEP_SUMMARY" ]; then
            SUMMARY_FILE="$GITHUB_WORKSPACE/reports/step_summary.md"
            touch "$SUMMARY_FILE"
            echo "GITHUB_STEP_SUMMARY=$SUMMARY_FILE" >> "$GITHUB_ENV"
          fi

      - name: Run PSRule with summary enabled
        id: psrule
        uses: .
        with:
          inputType: inputPath
          inputPath: tests/fixtures/input/
          source: tests/fixtures/ps-rule/
          summary: 'true'

      - name: Assert PSRule completed successfully with summary enabled
        run: |
          echo "PSRule action completed with summary=true without error"
          echo "PASS"
