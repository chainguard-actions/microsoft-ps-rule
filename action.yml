#
# GitHub Action manifest for PSRule
#
name: 'PSRule'
description: 'Run rules in a GitHub repository.'
author: 'Microsoft'
branding:
  icon: 'check-circle'
  color: 'green'
inputs:
  inputType:
    description: 'Determines the type of input to use for PSRule.'
    default: 'repository'
    required: false
  inputPath:
    description: 'The path PSRule will look for files to validate.'
    default: ''
    required: false
  modules:
    description: 'A comma separated list of modules to use for analysis.'
    default: ''
    required: false
  source:
    description: 'An path containing rules to use for analysis.'
    default: '.ps-rule/'
    required: false
  baseline:
    description: 'The name of a PSRule baseline to use.'
    default: ''
    required: false
  conventions:
    description: 'A comma separated list of conventions to use.'
    default: ''
    required: false
  option:
    description: 'The path to an options file.'
    default: ''
    required: false
  outcome:
    description: 'Filters output to include results with the specified outcome.'
    default: ''
    required: false
  outputFormat:
    description: 'The format to use when writing results to disk. When set to None results are not written to disk.'
    default: 'None'
    required: false
  outputPath:
    description: 'The file path to write results to.'
    default: ''
    required: false
  path:
    description: 'The working directory PSRule is run from.'
    default: ''
    required: false
  prerelease:
    description: 'Determine if a pre-release module version is installed.'
    default: 'false'
    required: false
  repository:
    description: 'The name of the PowerShell repository where PSRule modules are installed from. By default this is the PowerShell Gallery.'
    default: 'PSGallery'
    required: false
  version:
    description: 'The specific version of PSRule to use.'
    default: ''
    required: false
runs:
  using: 'composite'
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: 'Analysis'
      shell: pwsh
      working-directory: ${{ github.workspace }}
      env:
        INPUT_INPUTTYPE: ${{ inputs.inputType }}
        INPUT_INPUTPATH: ${{ inputs.inputPath }}
        INPUT_MODULES: ${{ inputs.modules }}
        INPUT_SOURCE: ${{ inputs.source }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_CONVENTIONS: ${{ inputs.conventions }}
        INPUT_OPTION: ${{ inputs.option }}
        INPUT_OUTCOME: ${{ inputs.outcome }}
        INPUT_OUTPUTFORMAT: ${{ inputs.outputFormat }}
        INPUT_OUTPUTPATH: ${{ inputs.outputPath }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_PRERELEASE: ${{ inputs.prerelease }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_VERSION: ${{ inputs.version }}
        PSRULE_ACTION_PATH: ${{ github.action_path }}
      run: |-
        & "$Env:PSRULE_ACTION_PATH/powershell.ps1"
